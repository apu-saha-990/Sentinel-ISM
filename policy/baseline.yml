# ISM-0584 note (2026-08-30): this VM has no rsyslog installed and no
# /var/log/auth.log file — login events are recorded only via
# systemd-journald. The ISM-0584 check queries journalctl directly
# (grep on pam_unix) rather than checking for a flat log file.

accounts:
  # Any account with a real login shell (/bin/bash, /bin/sh) not in this list is a finding.
  # System/service accounts (nologin, /bin/false, /bin/sync) are checked structurally,
  # not by name — a minimized install adds/removes these on its own.
  allowed_login_shells:
    - root
    - sentinel

services:
  # Currently active/running services confirmed as expected on sentinel-server.
  # multipathd.service and snapd.service are deliberately NOT included below —
  # they were running at baseline capture time but not yet justified for this VM's role.
  # Leaving them off means the scanner correctly flags them as findings until a decision is made.
  allowed_active:
    - chrony.service
    - dbus.service
    - getty@tty1.service
    - networkd-dispatcher.service
    - polkit.service
    - ssh.service
    - systemd-journald.service
    - systemd-logind.service
    - systemd-networkd.service
    - systemd-resolved.service
    - systemd-udevd.service
    - unattended-upgrades.service
    - user@1000.service

sudoers:
  # Real sudo group membership pulled from sentinel-server on 2026-08-30.
  # Only 'sentinel' is expected — root has access inherently (not via this group),
  # and no custom /etc/sudoers.d rules exist beyond Ubuntu's default README.
  allowed_members:
    - sentinel
